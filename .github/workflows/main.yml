name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true
          
      - name: Build APK
        run: |
          # پیدا کردن پوشه پروژه
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          cd "$PROJECT_DIR"
          
          # گرفتن پکیج‌ها
          flutter pub get
          
          # حذف NDK برای جلوگیری از خطا در سرور
          APP_BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$APP_BUILD_GRADLE" ]; then
            sed -i 's/^[ \t]*ndkVersion.*/\/\/ ndkVersion removed for GitHub Actions/' $APP_BUILD_GRADLE
          fi
          
          # ساخت APK با نادیده گرفتن خطاهای نسخه
          flutter build apk --release --android-skip-build-dependency-validation
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
